<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sims 2 Turn-Ons &amp; Turn-Off Randomizer</title>
<style>
  :root{
    --bg1:#0b2a5b; --bg2:#1d5aa8;
    --panel:#dbe8fa; --panel-edge:#7fa6dc; --panel-dark:#2c5c9e;
    --ink:#10284f; --ink-soft:#4a6590;
    --on:#3bb33b; --on-dark:#21791f;
    --off:#d63a3a; --off-dark:#922121;
    --plumbob:#5fe04c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif; color:var(--ink);
    background:radial-gradient(ellipse at top,var(--bg2),var(--bg1) 70%) fixed;
    display:flex; justify-content:center; padding:32px 16px;
  }
  .wrap{width:100%; max-width:860px}
  header{display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:20px; color:#fff}
  .plumbob{width:26px; height:44px; position:relative; filter:drop-shadow(0 0 8px rgba(95,224,76,.7)); animation:bob 3s ease-in-out infinite}
  .plumbob::before,.plumbob::after{content:""; position:absolute; left:0; width:0; height:0; border-left:13px solid transparent; border-right:13px solid transparent}
  .plumbob::before{top:0; border-bottom:22px solid var(--plumbob)}
  .plumbob::after{bottom:0; border-top:22px solid #3fb52f}
  @keyframes bob{0%,100%{transform:translateY(0) rotateY(0)}50%{transform:translateY(-6px) rotateY(180deg)}}
  h1{margin:0; font-size:28px; letter-spacing:.5px; text-shadow:0 2px 0 rgba(0,0,0,.35)}
  h1 small{display:block; font-size:13px; font-weight:normal; opacity:.8; letter-spacing:1px; text-transform:uppercase}

  .panel{
    background:linear-gradient(#eef4fd,var(--panel)); border:2px solid var(--panel-edge); border-radius:18px;
    box-shadow:inset 0 1px 0 #fff, 0 8px 24px rgba(0,0,0,.35); padding:20px; margin-bottom:18px;
  }
  .slots{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
  .slot{
    background:#fff; border-radius:14px; border:3px solid var(--on); padding:14px 10px 12px; text-align:center; position:relative;
    box-shadow:0 3px 0 var(--on-dark);
  }
  .slot.off{border-color:var(--off); box-shadow:0 3px 0 var(--off-dark)}
  .slot .tag{
    position:absolute; top:-12px; left:50%; transform:translateX(-50%); white-space:nowrap;
    background:var(--on); color:#fff; font-size:12px; font-weight:bold; padding:3px 12px; border-radius:20px; text-transform:uppercase; letter-spacing:1px;
  }
  .slot.off .tag{background:var(--off)}
  .icon{width:72px; height:72px; margin:8px auto 6px; display:flex; align-items:center; justify-content:center; border-radius:50%;
        background:radial-gradient(circle,#f3f8ff 40%,#d3e2f7)}
  .icon img{max-width:56px; max-height:56px; image-rendering:auto}
  .icon .fallback{font-size:26px; font-weight:bold; color:var(--ink-soft)}
  .slot .name{font-weight:bold; font-size:16px; min-height:22px}
  .slot .pack{font-size:11px; color:var(--ink-soft); margin-top:2px}
  .slot.spin .icon{animation:spin .12s linear infinite}
  @keyframes spin{50%{transform:scale(.88)}}
  .lock{
    margin-top:10px; background:none; border:1px solid var(--panel-edge); color:var(--ink-soft); border-radius:20px;
    font:inherit; font-size:12px; padding:3px 12px; cursor:pointer;
  }
  .lock[aria-pressed="true"]{background:var(--panel-dark); color:#fff; border-color:var(--panel-dark)}

  .actions{display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap}
  .btn{
    font:inherit; font-weight:bold; font-size:17px; cursor:pointer; border:none; border-radius:30px; padding:12px 30px; color:#fff;
    background:linear-gradient(#69d35a,#2f9a2a); box-shadow:0 4px 0 #1d6a1a, inset 0 1px 0 rgba(255,255,255,.5);
    text-shadow:0 1px 0 rgba(0,0,0,.3);
  }
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 #1d6a1a}
  .btn.secondary{background:linear-gradient(#6f9fe0,#2c5c9e); box-shadow:0 4px 0 #1b3d6d, inset 0 1px 0 rgba(255,255,255,.5); font-size:15px; padding:10px 22px}
  .btn.secondary:active{box-shadow:0 1px 0 #1b3d6d}

  h2{margin:0 0 4px; font-size:17px}
  .hint{margin:0 0 14px; font-size:13px; color:var(--ink-soft)}
  .packs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
  .packs label{background:#fff; border:1px solid var(--panel-edge); border-radius:20px; padding:5px 12px; font-size:14px; cursor:pointer; user-select:none}
  .packs input{accent-color:var(--panel-dark); margin-right:4px}
  .pool{display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px}
  .chip{
    background:#fff; border:2px solid transparent; border-radius:10px; padding:6px 4px; text-align:center; cursor:pointer; font:inherit; color:var(--ink);
    font-size:11.5px; line-height:1.2; transition:opacity .15s, border-color .15s;
  }
  .chip img{width:32px; height:32px; object-fit:contain; display:block; margin:0 auto 3px}
  .chip .fallback{display:block; height:32px; line-height:32px; font-weight:bold; color:var(--ink-soft)}
  .chip:hover{border-color:var(--panel-edge)}
  .chip.excluded{opacity:.3; text-decoration:line-through}
  .chip.hidden{display:none}
  .chip.picked-on{border-color:var(--on)}
  .chip.picked-off{border-color:var(--off)}

  .history{list-style:none; margin:0; padding:0; font-size:14px; max-height:220px; overflow:auto}
  .history li{padding:6px 2px; border-bottom:1px dashed var(--panel-edge)}
  .history li:last-child{border-bottom:none}
  .history .on{color:var(--on-dark); font-weight:bold}
  .history .off{color:var(--off-dark); font-weight:bold}
  .empty{color:var(--ink-soft); font-style:italic}
  footer{color:#c9dbf5; font-size:12px; text-align:center; margin-top:6px}
  footer a{color:#fff}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; transition:transform .25s; pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  @media (max-width:600px){
    .slots{grid-template-columns:1fr}
    h1{font-size:22px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="plumbob" aria-hidden="true"></div>
    <h1><small>The Sims 2</small>Turn-Ons &amp; Turn-Off Randomizer</h1>
  </header>

  <section class="panel">
    <div class="slots" id="slots"></div>
    <div class="actions">
      <button class="btn" id="roll">Randomize!</button>
      <button class="btn secondary" id="copy">Copy result</button>
    </div>
  </section>

  <section class="panel">
    <h2>Chemistry pool</h2>
    <p class="hint">Choose which packs you own, and click any trait to exclude it from the draw.</p>
    <div class="packs" id="packs"></div>
    <div class="pool" id="pool"></div>
  </section>

  <section class="panel">
    <h2>History</h2>
    <ul class="history" id="history"><li class="empty">No Sims rolled yet.</li></ul>
  </section>

  <footer>Icons from <a href="https://sims.fandom.com/wiki/Chemistry" target="_blank" rel="noopener">The Sims Wiki</a> (Fandom). Fan-made tool, not affiliated with EA or Maxis.</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const IMG = "https://static.wikia.nocookie.net/sims/images/";
const TRAITS = [
  // Nightlife
  {n:"Black Hair",        p:"NL", i:"6/60/Black_Hair.png"},
  {n:"Blond Hair",        p:"NL", i:"7/7a/Blonde_Hair.png"},
  {n:"Brown Hair",        p:"NL", i:"c/c6/Brown_Hair_%28chemistry%29.png"},
  {n:"Red Hair",          p:"NL", i:"f/f2/Red_Hair_%28chemistry%29.png"},
  {n:"Gray Hair",         p:"NL", i:"6/66/Grey_Hair.png"},
  {n:"Custom Hair",       p:"NL", i:"5/50/Custom_Hair.png"},
  {n:"Facial Hair",       p:"NL", i:"c/ce/Facial_Hair.png"},
  {n:"Fatness",           p:"NL", i:"f/f2/Fatness.png"},
  {n:"Fitness",           p:"NL", i:"b/b0/Fitness.png"},
  {n:"Cologne",           p:"NL", i:"2/29/Cologne.png"},
  {n:"Stink",             p:"NL", i:"6/6c/Stink.png"},
  {n:"Glasses",           p:"NL", i:"b/b4/Glasses.png"},
  {n:"Hats",              p:"NL", i:"1/1a/Hats.png"},
  {n:"Makeup",            p:"NL", i:"6/65/Makeup.png"},
  {n:"Full Face Makeup",  p:"NL", i:"5/5d/Full_Face_Makeup.png"},
  {n:"Formal Wear",       p:"NL", i:"c/c6/Formal_Wear.png"},
  {n:"Swim Wear",         p:"NL", i:"1/1e/Swim_Wear.png"},
  {n:"Underwear",         p:"NL", i:"8/81/Underwear.png"},
  {n:"Vampirism",         p:"NL", i:"3/33/Vampirism.png"},
  {n:"Zombiism",          p:"NL", i:"7/7b/Zombiism.png"},
  // Bon Voyage
  {n:"Jewelry",           p:"BV", i:"7/7b/Jewelry.png"},
  {n:"Robots",            p:"BV", i:"c/c5/Servo.png"},
  {n:"Lycanthropy",       p:"BV", i:"6/6e/Lycanthropy.png"},
  {n:"PlantSimism",       p:"BV", i:"5/59/PlantSim.png"},
  {n:"Great Cook",        p:"BV", i:"7/71/Skill_Cooking.png"},
  {n:"Good at Cleaning",  p:"BV", i:"e/ef/Skill_Cleaning.png"},
  {n:"Creative",          p:"BV", i:"8/81/Skill_Creativity.png"},
  {n:"Athletic",          p:"BV", i:"3/37/Skill_Body.png"},
  {n:"Logical",           p:"BV", i:"f/f9/Skill_Logic.png"},
  {n:"Charismatic",       p:"BV", i:"4/4f/Skill_Charisma.png"},
  {n:"Mechanical",        p:"BV", i:"a/a6/Skill_Mechanical.png"},
  {n:"Unemployed",        p:"BV", i:"1/1a/Unemployed_%28chemistry%29.png"},
  {n:"Hard Worker",       p:"BV", i:"a/a9/Hard_Worker.png"},
  // Apartment Life
  {n:"Witchiness",        p:"AL", i:"d/d6/Witchiness.png"},
];
const PACKS = {NL:"Nightlife", BV:"Bon Voyage", AL:"Apartment Life"};
const SLOTS = [{label:"Turn-On", off:false},{label:"Turn-On", off:false},{label:"Turn-Off", off:true}];

const state = {
  packs:{NL:true, BV:true, AL:true},
  excluded:new Set(),
  picks:[null,null,null],
  locks:[false,false,false],
  history:[],
};

const $ = id => document.getElementById(id);
function imgEl(t, cls){
  const img = new Image();
  img.src = IMG + t.i; img.alt = t.n; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
  if(cls) img.className = cls;
  img.onerror = () => { const s=document.createElement("span"); s.className="fallback"; s.textContent=t.n.split(" ").map(w=>w[0]).join(""); img.replaceWith(s); };
  return img;
}

/* ---------- Slots ---------- */
function buildSlots(){
  const wrap = $("slots");
  SLOTS.forEach((s, idx) => {
    const d = document.createElement("div");
    d.className = "slot" + (s.off ? " off" : "");
    d.innerHTML = `<span class="tag">${s.label}</span><div class="icon"></div><div class="name">?</div><div class="pack">&nbsp;</div>
      <button class="lock" aria-pressed="false">Lock</button>`;
    d.querySelector(".lock").onclick = e => {
      if(!state.picks[idx]) return;
      state.locks[idx] = !state.locks[idx];
      e.target.setAttribute("aria-pressed", state.locks[idx]);
      e.target.textContent = state.locks[idx] ? "Locked" : "Lock";
    };
    wrap.appendChild(d);
  });
}
function renderSlot(idx, t){
  const d = $("slots").children[idx];
  const icon = d.querySelector(".icon"); icon.innerHTML = "";
  if(t){ icon.appendChild(imgEl(t)); d.querySelector(".name").textContent = t.n; d.querySelector(".pack").textContent = PACKS[t.p]; }
}

/* ---------- Pool ---------- */
function available(){ return TRAITS.filter(t => state.packs[t.p] && !state.excluded.has(t.n)); }
function buildPacks(){
  for(const [k,v] of Object.entries(PACKS)){
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" checked>${v}`;
    l.querySelector("input").onchange = e => { state.packs[k] = e.target.checked; renderPool(); };
    $("packs").appendChild(l);
  }
}
function buildPool(){
  TRAITS.forEach(t => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.name = t.n; b.title = "Click to exclude / include";
    b.appendChild(imgEl(t)); b.append(t.n);
    b.onclick = () => { state.excluded.has(t.n) ? state.excluded.delete(t.n) : state.excluded.add(t.n); renderPool(); };
    $("pool").appendChild(b);
  });
}
function renderPool(){
  const picked = state.picks.map(p => p && p.n);
  [...$("pool").children].forEach(c => {
    const t = TRAITS.find(x => x.n === c.dataset.name);
    c.classList.toggle("hidden", !state.packs[t.p]);
    c.classList.toggle("excluded", state.excluded.has(t.n));
    c.classList.toggle("picked-on", picked[0]===t.n || picked[1]===t.n);
    c.classList.toggle("picked-off", picked[2]===t.n);
  });
}

/* ---------- Roll ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
let rolling = false;
function roll(){
  if(rolling) return;
  const locked = state.picks.filter((p,i)=>state.locks[i] && p).map(p=>p.n);
  const pool = shuffle(available().filter(t => !locked.includes(t.n)));
  const need = state.locks.filter((l,i)=>!(l && state.picks[i])).length;
  if(pool.length < need){ toast("Not enough traits in the pool — include more packs or traits."); return; }
  const final = state.picks.map((p,i)=> (state.locks[i] && p) ? p : pool.pop());

  rolling = true;
  const spinning = [0,1,2].filter(i => !(state.locks[i] && state.picks[i]));
  spinning.forEach(i => $("slots").children[i].classList.add("spin"));
  const all = available();
  let ticks = 0;
  const timer = setInterval(() => {
    spinning.forEach(i => { const t = all[Math.floor(Math.random()*all.length)]; $("slots").children[i].querySelector(".name").textContent = t.n; });
    if(++ticks >= 12){
      clearInterval(timer);
      spinning.forEach(i => $("slots").children[i].classList.remove("spin"));
      state.picks = final;
      final.forEach((t,i)=>renderSlot(i,t));
      renderPool();
      addHistory(final);
      rolling = false;
    }
  }, 60);
}

function addHistory(p){
  state.history.unshift(p);
  const ul = $("history"); ul.innerHTML = "";
  state.history.slice(0,25).forEach((h,i) => {
    const li = document.createElement("li");
    li.innerHTML = `#${state.history.length - i}: <span class="on">${h[0].n}</span> + <span class="on">${h[1].n}</span> · turned off by <span class="off">${h[2].n}</span>`;
    ul.appendChild(li);
  });
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

$("roll").onclick = roll;
$("copy").onclick = () => {
  const p = state.picks; if(!p[0]){ toast("Roll a Sim first!"); return; }
  const text = `Turn-ons: ${p[0].n}, ${p[1].n} | Turn-off: ${p[2].n}`;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(()=>toast("Copied!"), ()=>toast(text));
};
document.addEventListener("keydown", e => { if(e.code==="Space" && e.target.tagName!=="BUTTON" && e.target.tagName!=="INPUT"){ e.preventDefault(); roll(); } });

buildSlots(); buildPacks(); buildPool(); renderPool();
</script>
</body>
</html>
